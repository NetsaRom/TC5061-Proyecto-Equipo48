
name: MiBici MLOps CI

on:
  push:

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: CALIDAD DE CODIGO Y PRUEBAS
  # ==========================================
  quality-and-tests:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt
          pip install -r models/p2/requirements.txt

      - name: Revisar calidad del codigo con Ruff
        run: ruff check .

      - name: Ejecutar pruebas automatizadas
        run: pytest tests/ -v --ignore=tests/test_e2e.py


  # ==========================================
  # JOB 2: DOCKER E INTEGRACION E2E
  # ==========================================
  docker-integration:
    name: Docker Build and E2E Tests
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Verificar Docker Compose
        run: docker compose version

      - name: Construir e iniciar servicios
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Mostrar estado de los contenedores
        run: docker compose ps

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias para pruebas E2E
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Ejecutar pruebas de extremo a extremo
        run: pytest tests/test_e2e.py -v

      - name: Guardar imagen Docker validada
        if: github.ref == 'refs/heads/main'
        run: docker save mibici-p2-runtime:local | gzip > mibici-p2.tar.gz

      - name: Transferir imagen validada
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mibici-p2-image
          path: mibici-p2.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Mostrar logs si ocurre un error
        if: failure()
        run: docker compose logs

      - name: Apagar servicios
        if: always()
        run: docker compose down -v


  # ==========================================
  # JOB 3: CONTINUOUS DELIVERY
  # ==========================================
  publish-image:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: docker-integration
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar imagen validada
        uses: actions/download-artifact@v4
        with:
          name: mibici-p2-image

      - name: Cargar imagen Docker
        run: docker load -i mibici-p2.tar.gz

      - name: Autenticacion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Versionar y publicar imagen
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag mibici-p2-runtime:local "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
